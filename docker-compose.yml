services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9999:9999"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - revachol_data:/app/data
      - revachol_uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/revachol.db
      - STORAGE_TYPE=local
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9999/api/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{const j=JSON.parse(d);process.exit(j.status==='ok'?0:1)}catch(_){process.exit(1)}})}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:9999
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================================
  # Playwright E2E 测试容器
  # 依赖 backend + frontend 就绪，运行测试后自动退出
  # 用法：
  #   docker compose run --rm playwright-tests              # 运行测试
  #   docker compose run --rm playwright-tests --archive     # 运行测试 + 归档
  #   docker compose build playwright-tests                  # 仅构建镜像
  # ============================================================
  playwright-tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      # 测试结果持久化到宿主机
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./run-history:/app/run-history
    environment:
      - CI=true
      - BASE_URL=http://frontend:3000
    # 测试容器是一次性的，完成后自动退出
    restart: "no"
    # 默认运行 Docker 专用配置
    command: ["npx", "playwright", "test", "--config", "e2e-tests/playwright.docker.config.js"]

volumes:
  revachol_data:
  revachol_uploads:
