<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑器 - REVACHOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <!-- 引入编辑器专用样式（包含全局样式） -->
    <link rel="stylesheet" href="css/pages/editor.css">
</head>
<body>

    <!-- 主题预加载：心跳动画背景色跟随保存的主题，消除暗色闪烁 -->
    <style id="theme-preload">
      html[data-theme="dark"] .heartbeat-loader  { background: #1a1612; }
      html[data-theme="light"] .heartbeat-loader { background: #f5f0e8; }
      html[data-theme="lofi"] .heartbeat-loader  { background: #f0ead8; }
    </style>
    <script>
      (function(){var r=localStorage.getItem('rv_selected_theme'),t='dark';
      if(r){try{t=JSON.parse(r)}catch(e){t=r.replace(/"/g,'');}}
      document.documentElement.setAttribute('data-theme',t);})();
    </script>

    <!-- 心跳加载动画 — 与主页面一致的 SVG 波形 + 脉冲光晕 -->
    <div id="heartbeat-loader" class="heartbeat-loader">
        <svg viewBox="0 0 400 120" class="heartbeat-svg" xmlns="http://www.w3.org/2000/svg">
            <polyline points="0,60 20,60 30,60 35,20 45,100 55,60 75,60 85,60 90,30 100,90 110,60 140,60 160,60 170,60 175,25 185,95 195,60 220,60 240,60 250,60 255,35 265,85 275,60 300,60 310,60 315,30 325,90 335,60 380,60 400,60"
                      fill="none" stroke="var(--color-accent, #c47a44)" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            <polyline points="0,60 20,60 30,60 35,20 45,100 55,60 75,60 85,60 90,30 100,90 110,60 140,60 160,60 170,60 175,25 185,95 195,60 220,60 240,60 250,60 255,35 265,85 275,60 300,60 310,60 315,30 325,90 335,60 380,60 400,60"
                      fill="none" stroke="var(--color-accent, #c47a44)" stroke-width="4"
                      stroke-linecap="round" stroke-linejoin="round" opacity="0">
                <animate attributeName="opacity" values="0;0.9;0" dur="1s" repeatCount="indefinite"/>
            </polyline>
            <circle cx="50" cy="60" r="4" fill="var(--color-accent, #c47a44)" opacity="0.8">
                <animate attributeName="r" values="4;16;4" dur="1s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
            </circle>
            <circle cx="50" cy="60" r="5" fill="var(--color-accent, #c47a44)">
                <animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/>
            </circle>
        </svg>
        <p class="heartbeat-text">加载中</p>
    </div>

    <!-- 顶部工具栏 -->
    <div class="editor-toolbar">
        <div class="left">
            <button id="toggleSidebarBtn" class="toggle-btn" title="切换目录">◀</button>
            <span class="brand" id="brandText"></span>
        </div>
        <div class="actions">
            <button id="saveDraftBtn"></button>
            <button id="saveArticleBtn"></button>
            <button id="closeEditorBtn" class="close-btn"></button>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="editor-main">

        <!-- 左侧目录侧边栏 -->
        <div class="editor-sidebar" id="editorSidebar">
            <div class="editor-sidebar-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 14px; color: #e8c88a;" id="directoryLabel"></span>
                    <button id="toggleHistoryBtn" class="history-toggle-btn"></button>
                </div>
                <button id="collapseSidebarBtn" class="collapse-btn" title="收起目录">◀</button>
            </div>
            <!-- 历史记录面板（默认隐藏） -->
            <div id="historyPanel" class="history-panel" style="display: none;">
                <div id="historyList" style="font-size: 12px; color: #c4b5a0;"></div>
            </div>
            <!-- 侧边栏主体：包含工具栏和目录树 -->
            <div class="editor-sidebar-body">
                <!-- 固定工具栏（搜索 + 位置管理） -->
                <div class="editor-sidebar-toolbar">
                    <input type="text" id="editorSearchInput" class="search-box" placeholder="🔍 搜索目录..." autocomplete="off">
                    <div class="pos-controls" id="editorPositionControls">
                        <button id="editorEnterPosBtn">📌 进入位置管理</button>
                        <button id="editorSavePosBtn" class="hidden">💾 保存更改</button>
                        <button id="editorCancelPosBtn" class="hidden">❌ 取消</button>
                    </div>
                </div>
                <!-- 目录树容器 -->
                <div id="directoryTreeContainer">
                    <div id="treeLoadingPlaceholder" style="padding:20px;text-align:center;color:#7a6a58;">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 右侧编辑区 -->
        <div class="editor-content" id="editorContent">
            <div class="empty-state" id="emptyState"></div>

            <div class="editor-form" id="editorForm">
                <div class="form-group">
                    <label id="titleLabel"></label>
                    <input type="text" id="articleTitleInput" placeholder="">
                </div>
                <div class="form-group">
                    <label id="contentLabel"></label>
                    <textarea id="articleContentInput" placeholder=""></textarea>
                </div>
                <div class="form-actions">
                    <button class="save-btn" id="saveArticleBtn2"></button>
                    <button class="cancel-btn" id="cancelEditBtn"></button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="js/pages/article-editor.js"></script>
</body>
</html>
