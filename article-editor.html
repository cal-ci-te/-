<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章编辑器 - REVACHOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <!-- 引入编辑器专用样式（包含全局样式） -->
    <link rel="stylesheet" href="css/pages/editor.css">
</head>
<body>

    <!-- 顶部工具栏 -->
    <div class="editor-toolbar">
        <div class="left">
            <button id="toggleSidebarBtn" class="toggle-btn" title="切换目录">◀</button>
            <span class="brand" id="brandText"></span>
        </div>
        <div class="actions">
            <button id="saveDraftBtn"></button>
            <button id="saveArticleBtn"></button>
            <button id="closeEditorBtn" class="close-btn"></button>
        </div>
    </div>

    <!-- 主区域 -->
    <div class="editor-main">

        <!-- 左侧目录侧边栏 -->
        <div class="editor-sidebar" id="editorSidebar">
            <div class="editor-sidebar-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 14px; color: #e8c88a;" id="directoryLabel"></span>
                    <button id="toggleHistoryBtn" class="history-toggle-btn"></button>
                </div>
                <button id="collapseSidebarBtn" class="collapse-btn" title="收起目录">◀</button>
            </div>
            <!-- 历史记录面板（默认隐藏） -->
            <div id="historyPanel" class="history-panel" style="display: none;">
                <div id="historyList" style="font-size: 12px; color: #c4b5a0;"></div>
            </div>
            <!-- 侧边栏主体：包含工具栏和目录树 -->
            <div class="editor-sidebar-body">
                <!-- 固定工具栏（搜索 + 位置管理） -->
                <div class="editor-sidebar-toolbar">
                    <input type="text" id="editorSearchInput" class="search-box" placeholder="🔍 搜索目录..." autocomplete="off">
                    <div class="pos-controls" id="editorPositionControls">
                        <button id="editorEnterPosBtn">📌 进入位置管理</button>
                        <button id="editorSavePosBtn" class="hidden">💾 保存更改</button>
                        <button id="editorCancelPosBtn" class="hidden">❌ 取消</button>
                    </div>
                </div>
                <!-- 目录树容器 -->
                <div id="directoryTreeContainer">
                    <div id="treeLoadingPlaceholder" style="padding:20px;text-align:center;color:#7a6a58;">加载中...</div>
                </div>
            </div>
        </div>

        <!-- 右侧编辑区 -->
        <div class="editor-content" id="editorContent">
            <div class="empty-state" id="emptyState"></div>

            <div class="editor-form" id="editorForm">
                <div class="form-group">
                    <label id="titleLabel"></label>
                    <input type="text" id="articleTitleInput" placeholder="">
                </div>
                <div class="form-group">
                    <label id="contentLabel"></label>
                    <textarea id="articleContentInput" placeholder=""></textarea>
                </div>
                <div class="form-actions">
                    <button class="save-btn" id="saveArticleBtn2"></button>
                    <button class="cancel-btn" id="cancelEditBtn"></button>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "./js/": "./js/"
            }
        }
    </script>
    <script type="module" src="js/pages/article-editor.js"></script>
</body>
</html>
